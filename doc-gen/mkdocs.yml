site_name: Valkey GLIDE Python API Reference
site_url: https://valkey.io/valkey-glide
repo_url: https://github.com/valkey-io/valkey-glide
repo_name: GitHub
docs_dir: mkdocs
nav:
  - API Reference: /

theme:
  name: material
  palette:
    scheme: valkey-glide
  features:
    - navigation.sections
    - content.code.copy
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
  highlightjs: true
  font:
    text: Roboto
    code: Roboto Mono
markdown_extensions:
  - pymdownx.keys
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
plugins:
  - search
  - gen-files:
      scripts:
        - gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths:
            [
              "valkey-glide/python/glide-shared",
              "valkey-glide/python/glide-async/python",
              "valkey-glide/python/glide-sync/",
            ]
          options:
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_heading: true
            docstring_style: google
            members_order: source
            filters:
              - "!^_"
extra:
  generator: false
extra_css:
  - style.css
