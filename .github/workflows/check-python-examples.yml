name: Check Python Examples

# Syntax-validates the Python code examples in the docs. Extraction lives in
# scripts/check_examples.py; the bundled validator (scripts/validators/python.py)
# compiles each snippet with Python's compile(). See scripts/README.md.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-python-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout valkey-glide-docs
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python examples
        run: python scripts/check_examples.py --language python
