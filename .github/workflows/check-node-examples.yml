name: Check Node Examples

# Syntax-validates the Node.js (TypeScript / JavaScript) code examples in the
# docs. Extraction lives in scripts/check_examples.py; the bundled validator
# (scripts/validators/node.py) checks each snippet with the TypeScript
# compiler's transpileModule (syntax only). See scripts/README.md.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-node-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout valkey-glide-docs
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TypeScript
        # Installed to a separate prefix and exposed via NODE_PATH so it does
        # not interfere with the repo's pnpm-managed node_modules.
        run: |
          npm install --prefix "$RUNNER_TEMP/tsdeps" typescript
          echo "NODE_PATH=$RUNNER_TEMP/tsdeps/node_modules" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Node examples
        run: python scripts/check_examples.py --language node
