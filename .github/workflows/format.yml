name: Static Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check internal
        if: always()
        run: pnpm build

      - name: Verify sitemap exists
        if: always()
        run: ls -la dist/sitemap* && cat dist/sitemap-index.xml

      - name: Check external links
        if: always()
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: ${{ github.workspace }}/dist --root-dir ${{ github.workspace }}/dist
          fail: true
