name: Check Go Examples

# Syntax-validates the Go code examples in the docs. Extraction lives in
# scripts/check_examples.py; the bundled validator (scripts/validators/go.py)
# parses each snippet with `gofmt -e` (syntax only). See scripts/README.md.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-go-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout valkey-glide-docs
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Go examples
        run: python scripts/check_examples.py --language go
